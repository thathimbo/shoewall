name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sneaker-wall-layout-app-ftat6l]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
      # Doing it from here with `enablement: true` is not possible in this
      # repository: the workflow token is refused with "Resource not accessible
      # by integration". Once the source is set, every push deploys on its own.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # A project site is served from /<repo>/, so the bundle and the
          # on-demand OpenCV.js load both need that prefix.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
