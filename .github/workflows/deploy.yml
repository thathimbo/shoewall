name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sneaker-wall-layout-app-ftat6l]
  workflow_dispatch:

# Only contents:write is needed. The Pages *API* route was tried first and the
# workflow token is refused there: creating a Pages site needs administration
# rights, which GITHUB_TOKEN never has. Publishing to a gh-pages branch instead
# uses ordinary push access, and GitHub serves that branch without anyone
# having to open the repository settings.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A project site is served from /<repo>/, so the bundle and the
          # on-demand OpenCV.js load both need that prefix.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          cd dist
          # Without this, GitHub runs the output through Jekyll, which skips
          # files and directories whose names begin with an underscore.
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
